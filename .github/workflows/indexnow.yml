# Tras cada cambio en main, espera a que Vercel despliegue y avisa a Bing y otros buscadores (IndexNow).
name: IndexNow
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Esperar al despliegue
        run: sleep 240
      - name: Avisar a IndexNow
        run: node scripts/indexnow.mjs
